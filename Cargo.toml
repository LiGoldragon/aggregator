[package]
name         = "aggregator"
version      = "0.6.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/aggregator"
description  = "Aggregator evidence collection daemon and CLI scaffold."
publish      = false

[lib]
name = "aggregator"
path = "src/lib.rs"

[[bin]]
name = "aggregator-daemon"
path = "src/bin/aggregator-daemon.rs"

[[bin]]
name = "aggregator"
path = "src/bin/aggregator.rs"

[[bin]]
name = "meta-aggregator"
path = "src/bin/meta-aggregator.rs"

[[bin]]
name = "aggregator-write-configuration"
path = "src/bin/aggregator-write-configuration.rs"

[dependencies]
blake3 = "1"
datom-codec            = { git = "https://github.com/LiGoldragon/datom-codec", rev = "627db67f2655efd9f786864009955005fd8ab2ad" }
dotos-text-query       = { git = "https://github.com/LiGoldragon/dotos-text-query.git", rev = "aee1a446bb3236858d7157bad88dd63550abc25b", default-features = false }
fs2 = "0.4"
meta-signal-aggregator = { git = "https://github.com/LiGoldragon/meta-signal-aggregator", rev = "55ac16ac2fc5a18ba083e02168199421023e9771", features = ["datom"] }
protos                 = { git = "https://github.com/LiGoldragon/protos", rev = "171b21f65337983ab624b7b906397a4f1f92c5a3" }
rkyv                   = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
serde                  = { version = "1", features = ["derive"] }
serde_json             = "1"
signal                 = { git = "https://github.com/LiGoldragon/signal", rev = "8f9a0deb701cebbea518679548df4a795affc918", default-features = false }
signal-aggregator      = { git = "https://github.com/LiGoldragon/signal-aggregator", rev = "e5009d65527a5ac9658fb85f03685e26c78ec85c", features = ["datom"] }
thiserror              = "2"
time                   = { version = "0.3", features = ["formatting", "parsing"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = { level = "warn", priority = -1 }
